v><div><dt>AI 활용</dt><dd>기획 문서·코드·리소스 작성과 수정 지원</dd></div></dl></article><article class="cycle-explanation" data-cycle-explanation="3" id="cycle-explanation-3" tabindex="0"><div class="cycle-explanation-title"><span>04</span><h2>공용 MD 인수인계 갱신</h2></div><p>작업 내용·결정 사항·진행 상태를 공용 MD에 갱신하고 GitHub에 반영</p><dl><div><dt>직접 수행</dt><dd>변경 내용·남은 작업·주의 사항 검토</dd></div><div><dt>AI 활용</dt><dd>다음 에이전트가 참조할 인수인계 기록 정리</dd></div></dl></article></section></div></section><div class="section-title"><h2>단계별 작업과 역할</h2><span class="small">기획 수립부터 결과물 검증까지</span></div><section class="flow four-stage-flow" aria-label="AI 협업 순서도"><article class="step"><h3>역할 선언·동기화 요청</h3><p>‘나는 기획자야’ 등 역할 선언으로 사전 설정한 자동 동기화 절차 실행 요청</p></article><article class="step"><h3>개발 에이전트 동기화</h3><p>GitHub의 공용 MD·이전 작업물을 받아 현재 작업 기준과 진행 상태 동기화</p></article><article class="step"><h3>작업</h3><p>동기화한 맥락을 바탕으로 기획·개발 작업 수행 및 결과 검토</p></article><article class="step"><h3>공용 MD 인수인계 갱신</h3><p>작업 내용·결정 사항·진행 상태를 공용 MD에 갱신하고 GitHub에 반영</p></article></section><section class="split"><div class="knowledge"><div class="agents"><div class="agent">기획 AI</div><div class="agent">개발 AI</div></div><div class="trunk"></div><div class="stem"></div><div class="source">공통 기획 기준<span>기획 의도 · 시스템 규칙 · 완료 조건 · 변경 사항</span></div><p class="small" style="margin-top:15px">역할 선언 → GitHub 문서 확인 → 이전 작업 동기화</p></div><div><h2 class="sync-title">AI 에이전트 간 공통 지식 동기화</h2><p class="intro" style="font-size:15px;margin-top:18px">GPT에 역할별 문서 확인 순서와 작업 기준을 미리 설정했습니다. ‘나는 기획자야’ 또는 ‘나는 개발자야’라고 역할을 선언하면, GitHub의 해당 역할 문서와 이전 MD 인수인계를 확인해 작업 맥락을 동기화하도록 구성했습니다.</p><div class="principles"><div><h3>사람의 검토 지점</h3><p>의도 일치, 구현 가능성,<br>조건과 예외의 누락 확인</p></div><div><h3>효율 개선의 방향</h3><p>역할 선언으로 이전 맥락을 불러오도록 절차 설정,<br>반복 설명과 수동 인수인계 부담 축소</p></div></div><a class="text-link" href="#evidence">판단 사례 살펴보기</a></div></section>`;

const cycleStepDetails=[{"title":"역할 선언·동기화 요청","summary":"‘나는 기획자야’ 등 역할 선언으로 사전 설정한 자동 동기화 절차 실행 요청","human":"역할 선언, 이번 작업 목적 전달","ai":"역할에 맞는 GitHub 문서·이전 작업 확인 절차 시작"},{"title":"개발 에이전트 동기화","summary":"GitHub의 공용 MD·이전 작업물을 받아 현재 작업 기준과 진행 상태 동기화","human":"동기화한 내용과 이번 작업 범위 확인","ai":"기존 결정·변경 사항·남은 작업·개발 제약 확인"},{"title":"작업","summary":"동기화한 맥락을 바탕으로 기획·개발 작업 수행 및 결과 검토","human":"기획 의도·우선순위 결정, 작업 결과 검토","ai":"기획 문서·코드·리소스 작성과 수정 지원"},{"title":"공용 MD 인수인계 갱신","summary":"작업 내용·결정 사항·진행 상태를 공용 MD에 갱신하고 GitHub에 반영","human":"변경 내용·남은 작업·주의 사항 검토","ai":"다음 에이전트가 참조할 인수인계 기록 정리"}];
function bindCycleInteraction(){
 const buttons=Array.from(document.querySelectorAll('[data-cycle-step]'));
 const explanations=Array.from(document.querySelectorAll('[data-cycle-explanation]'));
 if(!buttons.length)return;
 const select=(index)=>{
  buttons.forEach((b,i)=>{b.setAttribute('aria-pressed',String(i===index));b.classList.toggle('is-active',i===index)});
  explanations.forEach((row,i)=>row.classList.toggle('is-highlighted',i===index));
  document.querySelector('.collab-cycle').setAttribute('data-active-step',String(index));
 };
 const clear=()=>{buttons.forEach(b=>{b.setAttribute('aria-pressed','false');b.classList.remove('is-active')});explanations.forEach(row=>row.classList.remove('is-highlighted'));document.querySelector('.collab-cycle').removeAttribute('data-active-step')};
 buttons.forEach((button,index)=>{
  button.addEventListener('pointerenter',()=>select(index));
  button.addEventListener('focus',()=>select(index));
  button.addEventListener('click',()=>select(index));
  button.addEventListener('keydown',event=>{
   let next=index;
   if(event.key==='ArrowRight'||event.key==='ArrowDown')next=(index+1)%buttons.length;
   else if(event.key==='ArrowLeft'||event.key==='ArrowUp')next=(index+buttons.length-1)%buttons.length;
   else return;
   event.preventDefault();buttons[next].focus();select(next);
  });
 });
 explanations.forEach((row,index)=>{row.addEventListener('pointerenter',()=>select(index));row.addEventListener('focus',()=>select(index))});
 const wrap=document.querySelector('.interactive-cycle-wrap');wrap.addEventListener('pointerleave',clear);wrap.addEventListener('focusout',event=>{if(!wrap.contains(event.relatedTarget))clear()});clear();
}
const pages={process,proposal,evidence};let theme='editorial';if(!['editorial','garden'].includes(theme))theme='editorial';function setTheme(v){theme=v;document.body.classList.toggle('garden',v==='garden');document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===v)));localStorage.setItem('verdure-concept',v)}document.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>setTheme(b.dataset.theme)));function render(){const key=location.hash.slice(1) in pages?location.hash.slice(1):'process';main.innerHTML=pages[key]+`<div class="page-end"><a class="text-link" href="#${{process:'proposal',proposal:'evidence',evidence:'process'}[key]}">${{process:'게임 제안 보기',proposal:'판단과 검증 보기',evidence:'AI 협업으로 돌아가기'}[key]}</a></div>`;document.querySelectorAll('nav a').forEach(a=>a.setAttribute('aria-current',a.hash==='#'+key?'page':'false'));bindCycleInteraction();window.scrollTo(0,0)}window.addEventListener('hashchange',render);document.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',render));setTheme('editorial');render();
</script></body></html>
